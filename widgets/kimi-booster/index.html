<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimi 加油包</title>
<style>
  :root { font-family: var(--kimi-font-sans); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .wrap { padding-block-start: var(--kimi-space-4); padding-inline: var(--kimi-space-4); padding-block-end: var(--kimi-space-4); width: 100%; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--kimi-space-3); margin-block-end: var(--kimi-space-2); }
  .head h1 { font-size: 17px; font-weight: 500; }
  .status { font-size: 12px; padding: 1px 8px; border-radius: var(--kimi-radius-chip); white-space: nowrap; }
  .status.ok { color: var(--kimi-color-positive); background: color-mix(in srgb, var(--kimi-color-positive) 12%, transparent); }
  .status.bad { color: var(--kimi-color-danger); background: color-mix(in srgb, var(--kimi-color-danger) 12%, transparent); }

  .big { font-size: 48px; font-weight: 500; line-height: 1.15; margin-block-end: var(--kimi-space-1); }
  .cur { font-size: 15px; color: var(--kimi-color-text-secondary); margin-inline-start: var(--kimi-space-1); }
  .pct { font-size: 14px; color: var(--kimi-color-text-tertiary); margin-inline-start: var(--kimi-space-2); }
  .cycle { font-size: 12px; color: var(--kimi-color-text-tertiary); }

  .split { display: flex; gap: var(--kimi-space-3); padding-block-start: var(--kimi-space-3); margin-block-start: var(--kimi-space-3); border-block-start: 0.5px solid var(--kimi-color-border); }
  .item { flex: 1; }
  .item .k { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-block-end: var(--kimi-space-1); }
  .item .v { font-size: 15px; font-weight: 500; }

  .err { padding: var(--kimi-space-4); border: 0.5px solid var(--kimi-color-border); border-radius: var(--kimi-radius-panel); }
  .err .t { font-size: 15px; font-weight: 500; margin-block-end: var(--kimi-space-1); display: flex; align-items: center; gap: var(--kimi-space-2); }
  .err .d { font-size: 13px; color: var(--kimi-color-text-secondary); }
  .dot { width: 8px; height: 8px; border-radius: var(--kimi-radius-full); background: var(--kimi-color-warning); flex: none; }
  .chart { margin-block-start: var(--kimi-space-3); }
  .chart svg { display: block; width: 100%; height: 54px; }
  .chart-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--kimi-color-text-tertiary); margin-block-start: 4px; }
  .chart-empty { margin-block-start: var(--kimi-space-3); font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .insight { margin-block-start: var(--kimi-space-3); padding: var(--kimi-space-2) var(--kimi-space-3); border-radius: var(--kimi-radius-panel); background: color-mix(in srgb, var(--kimi-color-text-tertiary) 10%, transparent); font-size: 12.5px; line-height: 1.45; color: var(--kimi-color-text-secondary); }
  .insight b { font-weight: 500; }
  .insight.warn { background: color-mix(in srgb, var(--kimi-color-warning) 14%, transparent); color: var(--kimi-color-warning); }
  .insight.alert { background: color-mix(in srgb, var(--kimi-color-danger) 14%, transparent); color: var(--kimi-color-danger); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="head">
    <h1>Kimi 加油包</h1>
    <span class="status ok" id="status">可用</span>
  </div>
  <div id="body">正在读取加油包…</div>
  <div id="insight"></div>
  <div id="chart"></div>
</div>

<script>
(function () {
  var SAMPLE = {
    ok: true, status: 'STATUS_ACTIVE', currency: 'CNY',
    left: 22.5, total: 200, used: 177.5, usedPct: 88.8,
    monthlyUsed: 2.5, cycleEnd: '2026-11-18T06:54:10Z',
    series: [], burnPerDay: null, daysLeft: null, samples: 0, level: 'ok',
    hint: '余额 ¥22.50（已用 88.8%）· 本周期消费 ¥2.50 · 11-18 重置周期'
  };

  function fmt(n) {
    if (n == null) return '—';
    return '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtRate(n) {
    if (n == null) return '—';
    return '¥' + Number(n).toFixed(Math.abs(n) < 1 ? 3 : 2);
  }
  function md(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return (d.getMonth() + 1) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render(d) {
    var status = document.getElementById('status');
    var body = document.getElementById('body');
    if (!d || d.ok === false) {
      status.textContent = '读取失败';
      status.className = 'status bad';
      body.innerHTML = '<div class="err"><div class="t"><span class="dot"></span>加油包读取失败</div><div class="d">' +
        escapeHtml((d && d.detail) || '稍后自动重试。') + '</div></div>';
      return;
    }
    var active = (d.status || '').indexOf('ACTIVE') >= 0;
    status.textContent = active ? '可用' : '已停用';
    status.className = 'status ' + (active ? 'ok' : 'bad');
    body.innerHTML =
      '<div class="big num">' + fmt(d.left) + '<span class="cur">' + escapeHtml(d.currency || 'CNY') + '</span>' +
      '<span class="pct num">已用 ' + Number(d.usedPct || 0).toFixed(1) + '%</span></div>' +
      '<div class="cycle">' + escapeHtml(md(d.cycleEnd)) + ' 重置周期 · 本周期消费 ' + fmt(d.monthlyUsed || 0) + '</div>' +
      '<div class="split">' +
      '<div class="item"><div class="k">加油包总额</div><div class="v num">' + fmt(d.total) + '</div></div>' +
      '<div class="item"><div class="k">已用</div><div class="v num">' + fmt(d.used) + '</div></div>' +
      '<div class="item"><div class="k">剩余</div><div class="v num">' + fmt(d.left) + '</div></div>' +
      '</div>';
  }

  function insightHtml(d) {
    if (!d || d.ok === false) return '';
    if (d.hint) return '<div class="insight ' + (d.level || 'ok') + '">' + escapeHtml(d.hint) + '</div>';
    var parts = [];
    parts.push('余额 <b>' + fmt(d.left) + '</b>（已用 ' + Number(d.usedPct || 0).toFixed(1) + '%）');
    if (d.burnPerDay) parts.push('日均 ' + fmtRate(d.burnPerDay));
    if (d.daysLeft != null) parts.push('还能撑 <b>' + (d.daysLeft > 999 ? '999+' : Math.max(0, Math.round(d.daysLeft))) + ' 天</b>');
    if (d.exhaustAt) parts.push('约 ' + md(d.exhaustAt) + ' 用完');
    if (!d.burnPerDay) parts.push(d.samples > 1 ? '近 ' + (d.windowDays || 7) + ' 天没消耗' : '攒历史中，下次刷新出结论');
    if ((d.level || 'ok') === 'alert') parts.unshift('⚠️');
    return '<div class="insight ' + (d.level || 'ok') + '">' + parts.join(' · ') + '</div>';
  }

  function spark(series) {
    if (!series || !series.length) return '';
    var max = Math.max.apply(null, series.map(function (p) { return p.used; }));
    if (!(max > 0)) return '<div class="chart-empty">近 14 天没有观测到扣费</div>';
    var w = 100, h = 34, pad = 2;
    var step = series.length > 1 ? (w - pad * 2) / (series.length - 1) : 0;
    var line = series.map(function (p, i) {
      var x = pad + i * step, y = h - pad - (p.used / max) * (h - pad * 2);
      return x.toFixed(2) + ',' + y.toFixed(2);
    }).join(' ');
    var area = line + ' ' + (pad + (series.length - 1) * step).toFixed(2) + ',' + (h - pad) + ' ' + pad + ',' + (h - pad);
    var dots = series.map(function (p, i) {
      if (!p.used) return '';
      var x = pad + i * step, y = h - pad - (p.used / max) * (h - pad * 2);
      return '<circle cx="' + x.toFixed(2) + '" cy="' + y.toFixed(2) + '" r="1.1" fill="var(--kimi-color-accent)"><title>' +
        p.date + '：' + fmt(p.used) + '</title></circle>';
    }).join('');
    return '<div class="chart"><svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polygon points="' + area + '" fill="color-mix(in srgb, var(--kimi-color-accent) 16%, transparent)"/>' +
      '<polyline points="' + line + '" fill="none" stroke="var(--kimi-color-accent)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + '</svg><div class="chart-meta"><span>近 14 天每日扣费</span><span>峰值 ' + fmt(max) + '</span></div></div>';
  }

  var _render = render;
  render = function (d) {
    _render(d);
    var box = document.getElementById('insight');
    if (box) box.innerHTML = insightHtml(d);
    var ch = document.getElementById('chart');
    if (ch) ch.innerHTML = (d && d.ok !== false && d.series) ? spark(d.series) : '';
  };

  var W = window.DaimonWidget;
  var current = (W && W.data && W.data.main) || SAMPLE;
  render(current);
  if (W && typeof W.onDataChange === 'function') {
    W.onDataChange(function (data) { render((data && data.main) || SAMPLE); });
  }
})();
</script>
</body>
</html>
