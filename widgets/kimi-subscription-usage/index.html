<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimi 订阅用量</title>
<style>
  :root { font-family: var(--kimi-font-sans); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button, input, select, textarea { font: inherit; }
  .wrap { padding-block-start: var(--kimi-space-4); padding-inline: var(--kimi-space-4); padding-block-end: var(--kimi-space-4); width: 100%; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--kimi-space-3); margin-block-end: var(--kimi-space-2); }
  .head h1 { font-size: 17px; font-weight: 500; }
  .head .meta { font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .status { font-size: 12px; padding: 1px 8px; border-radius: var(--kimi-radius-chip); white-space: nowrap; }
  .status.ok { color: var(--kimi-color-positive); background: color-mix(in srgb, var(--kimi-color-positive) 12%, transparent); }
  .status.bad { color: var(--kimi-color-danger); background: color-mix(in srgb, var(--kimi-color-danger) 12%, transparent); }

  .row { display: flex; align-items: baseline; justify-content: space-between; }
  .big { font-size: 48px; font-weight: 500; line-height: 1.15; }
  .big .lbl { font-size: 13px; font-weight: 400; color: var(--kimi-color-text-secondary); margin-inline-start: var(--kimi-space-2); }
  .remain { font-size: 12px; color: var(--kimi-color-text-tertiary); }

  .bar { height: 8px; border-radius: var(--kimi-radius-full); overflow: hidden; background: color-mix(in srgb, var(--kimi-color-text-tertiary) 18%, transparent); margin-block-start: var(--kimi-space-2); margin-block-end: var(--kimi-space-1); }
  .bar .seg { height: 100%; background: var(--kimi-color-brand, var(--kimi-color-accent, #4f6ef7)); border-radius: var(--kimi-radius-full); transition: width .4s ease; }
  .bar-note { font-size: 11px; color: var(--kimi-color-text-tertiary); margin-block-end: var(--kimi-space-3); }

  .split { display: flex; gap: var(--kimi-space-3); padding-block-start: var(--kimi-space-3); border-block-start: 0.5px solid var(--kimi-color-border); }
  .item { flex: 1; min-width: 0; }
  .item .k { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-block-end: var(--kimi-space-1); }
  .item .v { font-size: 14px; font-weight: 500; }

  .err { padding: var(--kimi-space-4); border: 0.5px solid var(--kimi-color-border); border-radius: var(--kimi-radius-panel); }
  .err .t { font-size: 15px; font-weight: 500; margin-block-end: var(--kimi-space-1); display: flex; align-items: center; gap: var(--kimi-space-2); }
  .err .d { font-size: 13px; color: var(--kimi-color-text-secondary); }
  .dot { width: 8px; height: 8px; border-radius: var(--kimi-radius-full); background: var(--kimi-color-warning); flex: none; }
  .chart { margin-block-start: var(--kimi-space-3); }
  .chart svg { display: block; width: 100%; height: auto; max-height: 120px; }
  .chart-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--kimi-color-text-tertiary); margin-block-start: 4px; }
  .chart-empty { margin-block-start: var(--kimi-space-3); font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .insight { margin-block-start: var(--kimi-space-3); padding: var(--kimi-space-2) var(--kimi-space-3); border-radius: var(--kimi-radius-panel); background: color-mix(in srgb, var(--kimi-color-text-tertiary) 10%, transparent); font-size: 12.5px; line-height: 1.45; color: var(--kimi-color-text-secondary); }
  .insight b { font-weight: 500; }
  .insight.warn { background: color-mix(in srgb, var(--kimi-color-warning) 14%, transparent); color: var(--kimi-color-warning); }
  .insight.alert { background: color-mix(in srgb, var(--kimi-color-danger) 14%, transparent); color: var(--kimi-color-danger); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="head">
    <h1>Kimi 订阅用量</h1>
    <span class="status ok" id="status">订阅中</span>
  </div>
  <div id="body">正在读取用量…</div>
  <div id="insight"></div>
  <div id="chart"></div>
</div>

<script>
(function () {
  var SAMPLE = { ok: true, active: true, plan: 'Allegretto', totalPct: 42.4, remainingPct: 57.6, codePct: 0, resetAt: '2026-11-17T09:10:55Z', subEnd: '2027-07-18T00:00:00Z', boostLeft: 0, boostTotal: 175, boostMonthlyUsed: 0, updatedAt: 'sample' };

  function pct(n) { return (n == null || isNaN(n)) ? '—' : Number(n).toFixed(1) + '%'; }
  // 服务端已经把 priceInCents 除过 100 了（单位=元），这里不要再除一次
  function fmtYuan(yuan) {
    if (yuan == null) return '—';
    return '¥' + Number(yuan).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtDate(s) {
    if (!s) return '—';
    var d = new Date(s);
    if (isNaN(d.getTime())) return s;
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render(d) {
    var status = document.getElementById('status');
    var body = document.getElementById('body');
    if (!d || d.ok === false) {
      status.textContent = '读取失败';
      status.className = 'status bad';
      body.innerHTML = '<div class="err"><div class="t"><span class="dot"></span>用量读取失败</div><div class="d">' +
        escapeHtml((d && d.detail) || '稍后自动重试。') + '</div></div>';
      return;
    }
    status.textContent = d.active === false ? '已过期' : (d.plan || '订阅中');
    status.className = 'status ' + (d.active === false ? 'bad' : 'ok');
    var total = d.totalPct == null ? 0 : Math.max(0, Math.min(100, Number(d.totalPct)));
    var remaining = d.remainingPct != null ? Number(d.remainingPct) : (100 - total);
    body.innerHTML =
      '<div class="row"><div class="big num">' + pct(d.totalPct) + '<span class="lbl">总使用量</span></div><div class="remain num">剩余 ' + pct(remaining) + '</div></div>' +
      '<div class="bar"><div class="seg" style="width:' + total + '%"></div></div>' +
      '<div class="bar-note">周期重置：' + escapeHtml(fmtDate(d.resetAt)) + ' · 订阅至 ' + escapeHtml(fmtDate(d.subEnd)) + '</div>' +
      '<div class="split">' +
      '<div class="item"><div class="k">加油包余额</div><div class="v num">' + fmtYuan(d.boostLeft) + '</div></div>' +
      '<div class="item"><div class="k">加油包总额</div><div class="v num">' + fmtYuan(d.boostTotal) + '</div></div>' +
      '<div class="item"><div class="k">本周期消费</div><div class="v num">' + fmtYuan(d.boostMonthlyUsed) + '</div></div>' +
      '</div>';
  }

  function md(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return (d.getMonth() + 1) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function insightHtml(d) {
    if (!d || d.ok === false) return '';
    var parts = [];
    if (d.rateBasis === 'cycle' && d.cycleDays != null && d.remainingPct != null) {
      parts.push('本周期日均 <b>' + Number(d.burnPerDay).toFixed(1) + ' 个点</b>（' +
        Math.round(d.cycleDays) + ' 天用了 ' + (100 - Number(d.remainingPct)).toFixed(1) + '%）');
    } else if (d.burnPerDay) {
      parts.push('日均 <b>' + Number(d.burnPerDay).toFixed(1) + ' 个点</b>');
    }
    var resetFirst = d.daysLeft != null && d.daysToReset != null && d.daysLeft >= d.daysToReset;
    if (resetFirst) {
      // 外推的用完日期落在重置之后 → 没意义，重置会把额度拉回 100%
      parts.push('够用到 <b>' + md(d.resetAt) + ' 重置</b>');
    } else if (d.daysLeft != null) {
      parts.push('还能撑 <b>' + (d.daysLeft > 999 ? '999+' : Math.max(0, Math.round(d.daysLeft))) + ' 天</b>');
      if (d.exhaustAt) parts.push('约 ' + md(d.exhaustAt) + ' 打光');
      if (d.daysToReset != null) parts.push('<b>撑不到重置</b>');
    }
    if (d.daysToReset != null) parts.push('距重置 ' + d.daysToReset + ' 天');
    if (!d.burnPerDay) parts.push(d.samples > 1 ? '近 ' + (d.windowDays || 7) + ' 天没消耗' : '攒历史中，下次刷新出结论');
    if ((d.level || 'ok') === 'alert') parts.unshift('⚠️');
    return '<div class="insight ' + (d.level || 'ok') + '">' + parts.join(' · ') + '</div>';
  }

  function fmtUsed(n) {
    return Number(n).toFixed(1) + ' 个点';
  }
  // 折线：网格 + Y 轴刻度 + X 轴日期；线细、留白足
  function spark(series) {
    if (!series || !series.length) return '<div class="chart-empty">近 14 天没有观测到消耗</div>';
    var pts = series;
    var maxV = Math.max.apply(null, pts.map(function (p) { return p.used; }));
    if (!(maxV > 0)) return '<div class="chart-empty">近 14 天没有观测到消耗</div>';
    var W = 320, H = 96, L = 34, R = 8, T = 10, B = 18;
    var iw = W - L - R, ih = H - T - B;
    var max = maxV, min = 0, span = max || 1;
    function xOf(i) { return L + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw); }
    function yOf(v) { return T + (1 - (v - min) / span) * ih; }
    var grid = '';
    for (var t = 0; t <= 3; t++) {
      var vy = max - (span * t / 3), yy = yOf(vy);
      grid += '<line x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) + '" stroke="rgba(255,255,255,.10)" stroke-width="0.6" stroke-dasharray="2 2"/>';
      grid += '<text x="' + (L - 4) + '" y="' + (yy + 3).toFixed(1) + '" text-anchor="end" font-size="7" fill="rgba(255,255,255,.45)">' + (vy.toFixed(1) + ' 点') + '</text>';
    }
    var line = pts.map(function (p, i) { return xOf(i).toFixed(1) + ',' + yOf(p.used).toFixed(1); }).join(' ');
    var area = line + ' ' + xOf(pts.length - 1).toFixed(1) + ',' + (T + ih) + ' ' + xOf(0).toFixed(1) + ',' + (T + ih);
    var xTicks = '', idx = [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
    idx.forEach(function (i, k) {
      var anchor = k === 0 ? 'start' : (k === 2 ? 'end' : 'middle');
      xTicks += '<text x="' + xOf(i).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="' + anchor + '" font-size="7" fill="rgba(255,255,255,.45)">' + pts[i].date + '</text>';
    });
    var axis = '<line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (T + ih) + '" stroke="rgba(255,255,255,.22)" stroke-width="0.7"/>' +
               '<line x1="' + L + '" y1="' + (T + ih) + '" x2="' + (W - R) + '" y2="' + (T + ih) + '" stroke="rgba(255,255,255,.22)" stroke-width="0.7"/>';
    var dots = pts.map(function (p, i) {
      if (!p.used) return '';
      return '<circle cx="' + xOf(i).toFixed(1) + '" cy="' + yOf(p.used).toFixed(1) + '" r="1.1" fill="var(--kimi-color-accent)"><title>' + p.date + '：' + fmtUsed(p.used) + '</title></circle>';
    }).join('');
    return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      grid + axis + '<polygon points="' + area + '" fill="color-mix(in srgb, var(--kimi-color-accent) 12%, transparent)"/>' +
      '<polyline points="' + line + '" fill="none" stroke="var(--kimi-color-accent)" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + xTicks + '</svg></div>';
  }
  var _render = render;
  render = function (d) {
    _render(d);
    var box = document.getElementById('insight');
    if (box) box.innerHTML = insightHtml(d);
    var cb = document.getElementById('chart');
    if (cb) cb.innerHTML = (d && d.ok !== false) ? spark(d.series) : '';
  };

  var W = window.DaimonWidget;
  var current = (W && W.data && W.data.main) || SAMPLE;
  render(current);
  if (W && typeof W.onDataChange === 'function') {
    W.onDataChange(function (data) { render((data && data.main) || SAMPLE); });
  }
})();
</script>
</body>
</html>
