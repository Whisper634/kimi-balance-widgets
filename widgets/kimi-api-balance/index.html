<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimi API 余额</title>
<style>
  :root { font-family: var(--kimi-font-sans); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button, input, select, textarea { font: inherit; }
  .wrap { padding: 20px 18px 18px; width: 100%; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--kimi-space-3); margin-block-end: var(--kimi-space-2); }
  .head h1 { font-size: 17px; font-weight: 500; }
  .head .meta { font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .status { font-size: 12px; padding: 1px 8px; border-radius: var(--kimi-radius-chip); white-space: nowrap; }
  .status.ok { color: var(--kimi-color-positive); background: color-mix(in srgb, var(--kimi-color-positive) 12%, transparent); }
  .status.bad { color: var(--kimi-color-danger); background: color-mix(in srgb, var(--kimi-color-danger) 12%, transparent); }

  .big { font-size: 48px; font-weight: 500; line-height: 1.15; margin-block-end: var(--kimi-space-1); }
  .cur { font-size: 15px; color: var(--kimi-color-text-secondary); margin-inline-start: var(--kimi-space-1); }

  .bar { display: flex; height: 6px; border-radius: var(--kimi-radius-full); overflow: hidden; background: color-mix(in srgb, var(--kimi-color-text-tertiary) 18%, transparent); margin-block-start: var(--kimi-space-3); }
  .bar .seg { height: 100%; }
  .bar .seg.cash { background: var(--kimi-color-positive); }
  .bar .seg.voucher { background: var(--kimi-color-brand, var(--kimi-color-accent, #4f6ef7)); }

  .split { display: flex; gap: var(--kimi-space-3); padding-block-start: var(--kimi-space-3); margin-block-start: var(--kimi-space-3); border-block-start: 0.5px solid var(--kimi-color-border); }
  .item { flex: 1; min-width: 0; }
  .item .k { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-block-end: var(--kimi-space-1); }
  .item .v { font-size: 15px; font-weight: 500; }
  .item .p { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-block-start: 2px; }

  .err { padding: var(--kimi-space-4); border: 0.5px solid var(--kimi-color-border); border-radius: var(--kimi-radius-panel); }
  .err .t { font-size: 15px; font-weight: 500; margin-block-end: var(--kimi-space-1); display: flex; align-items: center; gap: var(--kimi-space-2); }
  .err .d { font-size: 13px; color: var(--kimi-color-text-secondary); }
  .dot { width: 8px; height: 8px; border-radius: var(--kimi-radius-full); background: var(--kimi-color-warning); flex: none; }
  .chart { margin-block-start: var(--kimi-space-3); }
    .charts { display: flex; gap: 10px; margin-block-start: var(--kimi-space-3); }
  .charts > .chart-box { flex: 1; min-width: 0; }
  .charts svg { display: block; width: 100%; height: auto; max-height: 150px; }
  .chart-cap { font-size: 10.5px; color: var(--kimi-color-text-tertiary); margin-block-start: 2px; }
  .chart-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--kimi-color-text-tertiary); margin-block-start: 4px; }
  .chart-empty { margin-block-start: var(--kimi-space-3); font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .insight { margin-block-start: var(--kimi-space-3); padding: var(--kimi-space-2) var(--kimi-space-3); border-radius: var(--kimi-radius-panel); background: color-mix(in srgb, var(--kimi-color-text-tertiary) 10%, transparent); font-size: 12.5px; line-height: 1.45; color: var(--kimi-color-text-secondary); }
  .insight b { font-weight: 500; }
  .insight.warn { background: color-mix(in srgb, var(--kimi-color-warning) 14%, transparent); color: var(--kimi-color-warning); }
  .insight.alert { background: color-mix(in srgb, var(--kimi-color-danger) 14%, transparent); color: var(--kimi-color-danger); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="head">
    <h1>Kimi API 余额</h1>
    <span class="status ok" id="status">可用</span>
  </div>
  <div id="body">正在读取余额…</div>
  <div id="insight"></div>
  <div class="charts">
    <div class="chart-box"><div id="chart-hour"></div><div class="chart-cap" id="chart-hour-cap">近 1 小时</div></div>
    <div class="chart-box"><div id="chart-day"></div><div class="chart-cap">近 14 天每日</div></div>
  </div>
</div>

<script>
(function () {
  var SAMPLE = { ok: true, available: true, currency: 'CNY', total: 60.94, cash: 47.97, voucher: 12.97, voucherPct: 21.3, cashPct: 78.7, updatedAt: 'sample' };

  function fmt(n) {
    if (n == null) return '—';
    return '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function pct(n) {
    if (n == null || isNaN(n)) return '—';
    return Number(n).toFixed(1) + '%';
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render(d) {
    var status = document.getElementById('status');
    var body = document.getElementById('body');
    if (!d || d.ok === false) {
      status.textContent = '读取失败';
      status.className = 'status bad';
      body.innerHTML = '<div class="err"><div class="t"><span class="dot"></span>余额读取失败</div><div class="d">' +
        escapeHtml((d && d.detail) || '稍后自动重试。') + '</div></div>';
      return;
    }
    var total = Number(d.total) || 0;
    var voucherPct = d.voucherPct;
    var cashPct = d.cashPct;
    if (voucherPct == null && total > 0) voucherPct = Number(d.voucher) / total * 100;
    if (cashPct == null && total > 0) cashPct = Number(d.cash) / total * 100;
    voucherPct = Math.max(0, Math.min(100, voucherPct || 0));
    cashPct = Math.max(0, Math.min(100, cashPct || 0));

    status.textContent = d.available === false ? '不可用' : '可用';
    status.className = 'status ' + (d.available === false ? 'bad' : 'ok');
    body.innerHTML =
      '<div class="big num">' + fmt(d.total) + '<span class="cur">' + escapeHtml(d.currency || '') + '</span></div>' +
      '<div class="bar"><div class="seg cash" style="width:' + cashPct + '%"></div><div class="seg voucher" style="width:' + voucherPct + '%"></div></div>' +
      '<div class="split">' +
      '<div class="item"><div class="k">现金余额</div><div class="v num">' + fmt(d.cash) + '</div><div class="p num">' + pct(cashPct) + '</div></div>' +
      '<div class="item"><div class="k">代金券（加油包）</div><div class="v num">' + fmt(d.voucher) + '</div><div class="p num">' + pct(voucherPct) + '</div></div>' +
      '</div>';
  }

  function fmtRate(n) {
    if (n == null) return '—';
    return '¥' + Number(n).toFixed(Math.abs(n) < 1 ? 3 : 2);
  }
  function md(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return (d.getMonth() + 1) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function insightHtml(d) {
    if (!d || d.ok === false) return '';
    var parts = [];
    if (d.burnPerDay) parts.push('日均 <b>' + fmtRate(d.burnPerDay) + '</b>');
    if (d.daysLeft != null) parts.push('还能撑 <b>' + (d.daysLeft > 999 ? '999+' : Math.max(0, Math.round(d.daysLeft))) + ' 天</b>');
    if (d.exhaustAt) parts.push('约 ' + md(d.exhaustAt) + ' 用完');
    if (!d.burnPerDay) parts.push(d.samples > 1 ? '近 ' + (d.windowDays || 7) + ' 天没消耗' : '攒历史中，下次刷新出结论');
    if ((d.level || 'ok') === 'alert') parts.unshift('⚠️');
    return '<div class="insight ' + (d.level || 'ok') + '">' + parts.join(' · ') + '</div>';
  }

  function fmtUsed(n) {
    return '¥' + Number(n).toFixed(2);
  }
  // 折线：网格 + Y 轴刻度 + X 轴日期；线细、留白足
  // 左：近 1 小时（数值曲线）；右：近 14 天（每日消耗）
  function chartSvg(series, unit) {
    var pts = (series && series.points) || [];
    if (!pts.length) return '<div class="chart-empty">暂无采样</div>';
    var isValue = series.kind === 'value';
    var W = 210, H = 132, L = 32, R = 8, T = 10, B = 22;
    var iw = W - L - R, ih = H - T - B;
    var vals = pts.map(function (p) { return Number(p.v); });
    var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
    if (isValue) { var pv = (max - min) * 0.15 || 0.01; min -= pv; max += pv; }
    else { max = max || 1; min = 0; }
    var span = (max - min) || 1;
    function xOf(i) { return L + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw); }
    function yOf(v) { return T + (1 - (v - min) / span) * ih; }
    var grid = '';
    for (var t = 0; t <= 3; t++) {
      var vy = max - span * t / 3, yy = yOf(vy);
      grid += '<line x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) + '" stroke="rgba(255,255,255,.10)" stroke-width="0.6" stroke-dasharray="2 2"/>';
      grid += '<text x="' + (L - 3) + '" y="' + (yy + 2.5).toFixed(1) + '" text-anchor="end" font-size="8" fill="rgba(255,255,255,.45)">' + ('¥' + Number(vy).toFixed(2)) + '</text>';
    }
    var line = pts.map(function (p, i) { return xOf(i).toFixed(1) + ',' + yOf(p.v).toFixed(1); }).join(' ');
    var area = line + ' ' + xOf(pts.length - 1).toFixed(1) + ',' + (T + ih) + ' ' + xOf(0).toFixed(1) + ',' + (T + ih);
    var n = pts.length, ticksN = Math.min(4, n), seen = {}, xa = '';
    for (var k = 0; k < ticksN; k++) {
      var i = ticksN === 1 ? 0 : Math.round(k * (n - 1) / (ticksN - 1));
      var lab = pts[i].label;
      if (seen[lab]) continue;
      seen[lab] = 1;
      var anchor = (k === 0) ? 'start' : (k === ticksN - 1 ? 'end' : 'middle');
      xa += '<text x="' + xOf(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + anchor + '" font-size="8" fill="rgba(255,255,255,.45)">' + lab + '</text>';
    }
    var axis = '<line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (T + ih) + '" stroke="rgba(255,255,255,.18)" stroke-width="0.6"/>' +
               '<line x1="' + L + '" y1="' + (T + ih) + '" x2="' + (W - R) + '" y2="' + (T + ih) + '" stroke="rgba(255,255,255,.18)" stroke-width="0.6"/>';
    var dots = pts.length > 1 ? '' : '<circle cx="' + xOf(0).toFixed(1) + '" cy="' + yOf(pts[0].v).toFixed(1) + '" r="1.6" fill="var(--kimi-color-accent)"/>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + grid + axis +
      '<polygon points="' + area + '" fill="color-mix(in srgb, var(--kimi-color-accent) 12%, transparent)"/>' +
      '<polyline points="' + line + '" fill="none" stroke="var(--kimi-color-accent)" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + xa + '</svg>';
  }
  function paintCharts(d) {
    var hour = document.getElementById('chart-hour'), day = document.getElementById('chart-day');
    if (!hour || !day) return;
    if (!d || d.ok === false) { hour.innerHTML = ''; day.innerHTML = ''; return; }
    var charts = d.charts || {};
    var oneHour = charts['hour'];
    if (!oneHour || !oneHour.points || !oneHour.points.length) {
      var src = (charts['24h'] && charts['24h'].points) || (charts['1h'] && charts['1h'].points) || [];
      var dl = [];
      for (var i = 1; i < src.length; i++) {
        var dv = src[i - 1].v - src[i].v;
        dl.push({ label: src[i].label, v: dv > 0 ? dv : 0 });
      }
      oneHour = { kind: 'usage', points: dl.slice(-8) };
    }
    oneHour.kind = 'usage';
    var hourCap = document.getElementById('chart-hour-cap');
    if (hourCap) hourCap.textContent = '最近 ' + (oneHour.points ? oneHour.points.length : 0) + ' 次采样消耗';
    var daily = charts['14d'] || { kind: 'usage', points: (d.series || []).map(function (p) { return { label: p.date, v: p.used }; }) };
    hour.innerHTML = chartSvg(oneHour);
    day.innerHTML = chartSvg(daily);
  }
  var _render = render;
  render = function (d) {
    _render(d);
    var box = document.getElementById('insight');
    if (box) box.innerHTML = insightHtml(d);
    paintCharts(d);
  };

  var W = window.DaimonWidget;
  var current = (W && W.data && W.data.main) || SAMPLE;
  render(current);
  if (W && typeof W.onDataChange === 'function') {
    W.onDataChange(function (data) { render((data && data.main) || SAMPLE); });
  }
})();
</script>
</body>
</html>
