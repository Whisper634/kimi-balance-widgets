<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek API 余额</title>
<style>
  :root { font-family: var(--kimi-font-sans); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button, input, select, textarea { font: inherit; }
  .wrap { padding-block-start: var(--kimi-space-4); padding-inline: var(--kimi-space-4); padding-block-end: var(--kimi-space-4); width: 100%; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--kimi-space-3); margin-block-end: var(--kimi-space-2); }
  .head h1 { font-size: 17px; font-weight: 500; }
  .head .meta { font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .status { font-size: 12px; padding: 1px 8px; border-radius: var(--kimi-radius-chip); white-space: nowrap; }
  .status.ok { color: var(--kimi-color-positive); background: color-mix(in srgb, var(--kimi-color-positive) 12%, transparent); }
  .status.bad { color: var(--kimi-color-danger); background: color-mix(in srgb, var(--kimi-color-danger) 12%, transparent); }

  .big { font-size: 56px; font-weight: 500; line-height: 1.15; margin-block-end: var(--kimi-space-1); }
  .cur { font-size: 15px; color: var(--kimi-color-text-secondary); margin-inline-start: var(--kimi-space-1); }

  .bar { display: flex; height: 10px; border-radius: var(--kimi-radius-full); overflow: hidden; background: color-mix(in srgb, var(--kimi-color-text-tertiary) 18%, transparent); margin-block-start: var(--kimi-space-3); }
  .bar > i { display: block; height: 100%; }
  .legend { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--kimi-color-text-tertiary); margin-block-start: 4px; }
  .split { display: flex; gap: var(--kimi-space-3); padding-block-start: var(--kimi-space-3); margin-block-start: var(--kimi-space-3); border-block-start: 0.5px solid var(--kimi-color-border); }
  .item { flex: 1; }
  .item .k { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-block-end: var(--kimi-space-1); }
  .item .v { font-size: 15px; font-weight: 500; }

  .err { padding: var(--kimi-space-4); border: 0.5px solid var(--kimi-color-border); border-radius: var(--kimi-radius-panel); }
  .err .t { font-size: 15px; font-weight: 500; margin-block-end: var(--kimi-space-1); display: flex; align-items: center; gap: var(--kimi-space-2); }
  .err .d { font-size: 13px; color: var(--kimi-color-text-secondary); }
  .dot { width: 8px; height: 10px; border-radius: var(--kimi-radius-full); background: var(--kimi-color-warning); flex: none; }
  .range-tabs { display: flex; gap: 6px; margin-block-start: var(--kimi-space-3); }
  .range-tabs button { flex: 1; font: inherit; font-size: 11px; padding: 3px 0; border-radius: var(--kimi-radius-chip); background: transparent; border: 0.5px solid var(--kimi-color-border); color: var(--kimi-color-text-tertiary); cursor: pointer; }
  .range-tabs button.on { background: color-mix(in srgb, var(--kimi-color-accent) 16%, transparent); border-color: color-mix(in srgb, var(--kimi-color-accent) 50%, transparent); color: var(--kimi-color-accent); }
  .chart { margin-block-start: var(--kimi-space-3); }
  .chart svg { display: block; width: 100%; height: 54px; }
  .chart-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--kimi-color-text-tertiary); margin-block-start: 4px; }
  .chart-empty { margin-block-start: var(--kimi-space-3); font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .insight { margin-block-start: var(--kimi-space-3); padding: var(--kimi-space-2) var(--kimi-space-3); border-radius: var(--kimi-radius-panel); background: color-mix(in srgb, var(--kimi-color-text-tertiary) 10%, transparent); font-size: 12.5px; line-height: 1.45; color: var(--kimi-color-text-secondary); }
  .insight b { font-weight: 500; }
  .insight.warn { background: color-mix(in srgb, var(--kimi-color-warning) 14%, transparent); color: var(--kimi-color-warning); }
  .insight.alert { background: color-mix(in srgb, var(--kimi-color-danger) 14%, transparent); color: var(--kimi-color-danger); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="head">
    <h1>DeepSeek API 余额</h1>
    <span class="status ok" id="status">可用</span>
  </div>
  <div id="body">正在读取余额…</div>
  <div id="insight"></div>
    <div class="range-tabs" id="range-tabs">
    <button data-range="24h">1 天</button><button data-range="14d" class="on">14 天</button><button data-range="30d">1 个月</button>
  </div>
  <div id="chart"></div>
</div>

<script>
(function () {
  var SAMPLE = { ok: true, available: true, currency: 'CNY', total: 96.5, granted: 0, toppedUp: 96.5, updatedAt: 'sample' };

  function fmt(n) {
    if (n == null) return '—';
    return '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render(d) {
    var status = document.getElementById('status');
    var body = document.getElementById('body');
    if (!d || d.ok === false) {
      status.textContent = '读取失败';
      status.className = 'status bad';
      body.innerHTML = '<div class="err"><div class="t"><span class="dot"></span>余额读取失败</div><div class="d">' +
        escapeHtml((d && d.detail) || '稍后自动重试。') + '</div></div>';
      return;
    }
    status.textContent = d.available === false ? '不可用' : '可用';
    status.className = 'status ' + (d.available === false ? 'bad' : 'ok');
    body.innerHTML =
      '<div class="big num">' + fmt(d.total) + '<span class="cur">' + escapeHtml(d.currency || '') + '</span></div>' +
      '<div class="bar"><i style="width:' + (Number(d.toppedUp || 0) / ((Number(d.toppedUp || 0) + Number(d.granted || 0)) || 1) * 100).toFixed(1) + '%;background:var(--kimi-color-accent)"></i>' +
      '<i style="width:' + (Number(d.granted || 0) / ((Number(d.toppedUp || 0) + Number(d.granted || 0)) || 1) * 100).toFixed(1) + '%;background:var(--kimi-color-positive)"></i></div>' +
      '<div class="legend"><span>充值 ' + fmt(d.toppedUp) + '</span><span>赠送 ' + fmt(d.granted) + '</span></div>' +
      '<div class="split">' +
      '<div class="item"><div class="k">充值余额</div><div class="v num">' + fmt(d.toppedUp) + '</div></div>' +
      '<div class="item"><div class="k">赠送余额</div><div class="v num">' + fmt(d.granted) + '</div></div>' +
      '</div>';
  }

  function fmtRate(n) {
    if (n == null) return '—';
    return '¥' + Number(n).toFixed(Math.abs(n) < 1 ? 3 : 2);
  }
  function md(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return (d.getMonth() + 1) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function insightHtml(d) {
    if (!d || d.ok === false) return '';
    var parts = [];
    if (d.burnPerDay) parts.push('日均 <b>' + fmtRate(d.burnPerDay) + '</b>');
    if (d.daysLeft != null) parts.push('还能撑 <b>' + (d.daysLeft > 999 ? '999+' : Math.max(0, Math.round(d.daysLeft))) + ' 天</b>');
    if (d.exhaustAt) parts.push('约 ' + md(d.exhaustAt) + ' 用完');
    if (!d.burnPerDay) parts.push(d.samples > 1 ? '近 ' + (d.windowDays || 7) + ' 天没消耗' : '攒历史中，下次刷新出结论');
    if ((d.level || 'ok') === 'alert') parts.unshift('⚠️');
    return '<div class="insight ' + (d.level || 'ok') + '">' + parts.join(' · ') + '</div>';
  }

  function fmtUsed(n) {
    return '¥' + Number(n).toFixed(2);
  }
  var RANGES = ['24h', '14d', '30d'];
  var CURRENT_RANGE = localStorage.getItem('kimiCostRange') || '14d';
  if (RANGES.indexOf(CURRENT_RANGE) < 0) CURRENT_RANGE = '14d';
  var LAST_DATA = null;
  function spark(series) {
    if (!series || !series.points || !series.points.length) return '<div class="chart-empty">这个区间还没有采样</div>';
    var pts = series.points;
    var w = 100, h = 34, pad = 2;
    var vals = pts.map(function (p) { return Number(p.v); });
    var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
    var isValue = series.kind === 'value';
    var spanV = max - min;
    function yOf(v) {
      if (isValue) return spanV === 0 ? h / 2 : pad + (1 - (v - min) / spanV) * (h - pad * 2);
      return h - pad - (v / (max || 1)) * (h - pad * 2);
    }
    var step = pts.length > 1 ? (w - pad * 2) / (pts.length - 1) : 0;
    var line = pts.map(function (p, i) { return (pad + i * step).toFixed(2) + ',' + yOf(p.v).toFixed(2); }).join(' ');
    var area = line + ' ' + (pad + (pts.length - 1) * step).toFixed(2) + ',' + (h - pad) + ' ' + pad + ',' + (h - pad);
    var dots = pts.map(function (p, i) {
      var x = pad + i * step;
      return '<circle cx="' + x.toFixed(2) + '" cy="' + yOf(p.v).toFixed(2) + '" r="0.9" fill="var(--kimi-color-accent)"><title>' +
        p.label + '：' + fmtUsed(p.v) + '</title></circle>';
    }).join('');
    var meta = isValue
      ? '<span>' + pts[0].label + ' → ' + pts[pts.length - 1].label + '</span><span>' + fmtUsed(min) + ' ~ ' + fmtUsed(max) + '</span>'
      : '<span>每日消耗</span><span>峰值 ' + fmtUsed(max) + '</span>';
    var axis = '<div class="chart-axis"><span>' + pts[0].label + '</span><span>' + pts[Math.floor(pts.length / 2)].label + '</span><span>' + pts[pts.length - 1].label + '</span></div>';
    return '<div class="chart"><svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polygon points="' + area + '" fill="color-mix(in srgb, var(--kimi-color-accent) 16%, transparent)"/>' +
      '<polyline points="' + line + '" fill="none" stroke="var(--kimi-color-accent)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + '</svg><div class="chart-meta">' + meta + '</div>' + axis + '</div>';
  }
  function paintChart() {
    var d = LAST_DATA;
    var cb = document.getElementById('chart');
    if (!cb) return;
    if (!d || d.ok === false) { cb.innerHTML = ''; return; }
    var chart = (d.charts && d.charts[CURRENT_RANGE]) || (d.series ? { kind: 'usage', points: (d.series || []).map(function (p) { return { label: p.date, v: p.used }; }) } : null);
    cb.innerHTML = spark(chart);
    var tabs = document.querySelectorAll('#range-tabs button');
    for (var i = 0; i < tabs.length; i++) tabs[i].className = tabs[i].getAttribute('data-range') === CURRENT_RANGE ? 'on' : '';
  }
  var _render = render;
  render = function (d) {
    _render(d);
    var box = document.getElementById('insight');
    if (box) box.innerHTML = insightHtml(d);
    LAST_DATA = d;
    paintChart();
  };

  document.getElementById('range-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    CURRENT_RANGE = b.getAttribute('data-range');
    localStorage.setItem('kimiCostRange', CURRENT_RANGE);
    paintChart();
  });
  var W = window.DaimonWidget;
  var current = (W && W.data && W.data.main) || SAMPLE;
  render(current);
  if (W && typeof W.onDataChange === 'function') {
    W.onDataChange(function (data) { render((data && data.main) || SAMPLE); });
  }
})();
</script>
</body>
</html>
